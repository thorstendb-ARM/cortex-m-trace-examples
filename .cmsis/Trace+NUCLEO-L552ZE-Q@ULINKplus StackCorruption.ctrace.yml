# Watch only the first word of this thread's stack: RTX writes its magic here.
# Resolve the address from the selected ELF; size: 4 excludes the rest of the stack.
ctrace:
  setup:
    - core: Cortex-M33
      data:
        - location: g_stack_corruption_stack
          label: StackMagic
          access: W
          size: 4
          output: PC
        - location: g_trace_itm_counter
          access: W
          output: PC+value
      itm:
        enable: 0x00000000
      pcsampling:
        period: 0
      synchronization:
        DWT: 16M
        sync-on-run: true

# No timestamps, exception events, or other trace sources. pyTS clears the
# previous ITM/DWT configuration before enabling this single data watch.
# Protocol synchronization lets ctrace decode even this very short capture.
