# Build inputs; cbuild generates *.cbuild*.yml and the debugger run description.
solution:
  created-for: CMSIS-Toolbox@2.15.0
  compiler: GCC@14.3.1
  cdefault:

  packs:
    - pack: ARM::CMSIS@6.3.0
    - pack: ARM::CMSIS-RTX@5.9.0

  build-types:
    - type: Debug
      debug: on
      optimize: none

  target-types:
    - type: MCBSTM32F400
      device: STMicroelectronics::STM32F407IGHx
      variables:
        - Board-Layer: $SolutionDir()$/Board/MCBSTM32F400/Board.clayer.yml
      target-set:
        - set:
          images:
            - project-context: TraceDemo.Debug
          debugger:
            name: ULINKplus@pyOCD
            protocol: swd
            trace:
              - swo-uart:
                mode: file
                input-clock: 16000000
                output-clock: 1000000

    - type: NUCLEO-L552ZE-Q
      device: STMicroelectronics::STM32L552ZETxQ
      processor:
        trustzone: off
      variables:
        - Board-Layer: $SolutionDir()$/Board/NUCLEO-L552ZE-Q/Board.clayer.yml
      target-set:
        - set: ULINKplus
          images:
            - project-context: TraceDemo.Debug
          debugger:
            name: ULINKplus@pyOCD
            protocol: swd
            clock: 10000000
            trace:
              - swo-uart:
                mode: file
                input-clock: 4000000
                output-clock: 1000000
        - set: STLink
          images:
            - project-context: TraceDemo.Debug
          debugger:
            name: ST-Link@pyOCD
            protocol: swd
            clock: 4000000
            trace:
              - swo-uart:
                mode: file
                input-clock: 4000000
                output-clock: 1000000

    - type: NUCLEO-F756ZG
      device: STMicroelectronics::STM32F756ZGTx
      variables:
