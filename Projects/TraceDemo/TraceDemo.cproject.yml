project:
  description: Common RTX5 application for Cortex-M trace experiments
  language-C: c11
  output:
    type:
      - elf
      - hex
      - bin

  add-path:
    - ../../Common/Include

  components:
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS:OS Tick:SysTick
    - component: ARM::CMSIS:RTOS2:Keil RTX5&Source

  groups:
    - group: Application
      files:
        - file: ../../Common/App/app_main.c
        - file: ../../Common/Include/app.h
        - file: ../../Common/Include/target.h
    - group: Workloads
      files:
        - file: ../../Common/Workloads/dwt_workload.c
        - file: ../../Common/Include/dwt_workload.h

    - group: Stack Corruption
      for-context: .StackCorruption+NUCLEO-L552ZE-Q
      files:
        - file: ../../Common/Workloads/stack_corruption.c
        - file: ../../Common/Include/stack_corruption.h

    - group: Trace Output
      files:
        - file: ../../Common/Trace/itm_output.c
        - file: ../../Common/Include/trace.h

  executes:
    - execute: CopyRA8P1DebugDescription
      for-context: .Debug+EK-RA8P1
      run: cmake -E copy_if_different $input(1)$ $output(0)$
      always:
      input:
        - $elf()$
        - $SolutionDir()$/Board/EK-RA8P1/debug-run.yml
      output:
        - $SolutionDir()$/out/Trace+EK-RA8P1.cbuild-run.yml

  layers:
    - layer: $Board-Layer$
      type: Board
